# ============================================================
# NASCDI Lexicon — Kashmir Apple Supply Chain Disruption Index
# ============================================================
# Research context: Apple price transmission between production
# markets (Shopian, Sopore) and terminal market (Azadpur),
# mediated by NH-44 connectivity and regional disruptions.
#
# Term weights:
#   > 0 = DISRUPTION (raises index)
#   < 0 = MITIGATION (lowers index — restoration of normalcy)
#
# Weights calibrated on a [0.5, 3.0] scale:
#   0.5–1.0 : weak/indirect signal
#   1.5–2.0 : moderate, confirmed disruption
#   2.5–3.0 : severe, prolonged disruption
# ============================================================

