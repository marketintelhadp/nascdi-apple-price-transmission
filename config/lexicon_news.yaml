# NASCDI news/lexicon construction lexicon.
# Use this file for the actual GDELT/news NASCDI pipeline.
#
# Design rule:
# - disruption_terms move the index up.
# - mitigation_terms move the index down.
# - commodity_terms are context filters only; they do not enter score_raw.
#   This avoids false positives where a headline merely mentions NH-44 or Kashmir.

